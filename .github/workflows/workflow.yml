name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

on:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Устанавливаем build и twine здесь (для сборки)
      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build a binary wheel and a source tarball
        run: python -m build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI 🧪
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' || github.ref_type == 'tag'
    env:
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      # ⚠️ КРИТИЧЕСКИ ВАЖНО: устанавливаем twine прямо здесь, в этом же джобе
      - name: Install twine
        run: python -m pip install twine

      - name: Publish distribution 📦 to TestPyPI via twine
        run: twine upload --repository testpypi --verbose dist/*

  publish-to-pypi:
    name: Publish to PyPI 🚀
    needs: [build]
    runs-on: ubuntu-latest
    # Публикуем только при тегах (vX.Y.Z)
    if: startsWith(github.ref, 'refs/tags/')
    env:
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      # ⚠️ И здесь тоже обязательно устанавливаем twine
      - name: Install twine
        run: python -m pip install twine

      - name: Publish distribution 📦 to PyPI via twine
        run: twine upload dist/*
